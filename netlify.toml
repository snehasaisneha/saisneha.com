# Static Astro site. These settings apply to production and preview builds.
[build]
  command = "pnpm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"
  PNPM_FLAGS = "--frozen-lockfile"
# pnpm is pinned by packageManager in package.json.
